version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hms-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hms
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: hms-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
