server.port=0
spring.application.name=hms-api-mysql-test

# Dedicated MySQL Test Schema (hms_test)
spring.datasource.url=jdbc:mysql://localhost:3306/hms_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=hms
spring.datasource.password=${DB_PASSWORD:hms_password_123}

# JPA & Hibernate - ddl-auto stays "none", Flyway runs the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations with MySQL vendor scripts
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-mysql

# Hospital Timezone & Scheduling Defaults
app.timezone=Asia/Kolkata
app.appointment.max-advance-days=60
app.appointment.min-lead-minutes=30
app.appointment.auto-confirm-minutes=0

# JWT Test Config
app.jwt.secret=supersecretjwtkeythatmustbechangedinproductionandhasatleast256bitslength
app.jwt.access-token-expiration-ms=1800000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.cookie.secure=false
app.jwt.cookie.same-site=Strict

# Mail test
spring.mail.host=localhost
spring.mail.port=1025

# Storage
app.storage.local-dir=./target/test-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

