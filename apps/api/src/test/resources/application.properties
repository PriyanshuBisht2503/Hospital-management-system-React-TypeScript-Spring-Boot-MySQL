server.port=0
spring.application.name=hms-api-test

# In-Memory H2 in MySQL Mode for Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:hms_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate - ddl-auto stays "none", Flyway runs the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Test Config
app.jwt.secret=supersecretjwtkeythatmustbechangedinproductionandhasatleast256bitslength
app.jwt.access-token-expiration-ms=1800000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.cookie.secure=false
app.jwt.cookie.same-site=Strict

# Dev Admin Seed
app.auth.dev-admin.email=admin@aster.ae
app.auth.dev-admin.password=Admin@Aster123
app.auth.dev-admin.full-name=System Administrator

# Mail test
spring.mail.host=localhost
spring.mail.port=1025

# Storage
app.storage.local-dir=./target/test-uploads
