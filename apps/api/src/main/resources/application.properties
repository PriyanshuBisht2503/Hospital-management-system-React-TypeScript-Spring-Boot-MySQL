server.port=4000
spring.application.name=hms-api

# Database DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hms_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate - Fixed Rule: ddl-auto strictly "none"
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration
app.jwt.secret=${JWT_SECRET:supersecretjwtkeythatmustbechangedinproductionandhasatleast256bitslength}
app.jwt.access-token-expiration-ms=1800000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.cookie.secure=false
app.jwt.cookie.same-site=Strict

# Dev Admin Seed
app.auth.dev-admin.email=${DEV_ADMIN_EMAIL:admin@aster.ae}
app.auth.dev-admin.password=${DEV_ADMIN_PASSWORD:Admin@Aster123}
app.auth.dev-admin.full-name=${DEV_ADMIN_FULL_NAME:System Administrator}

# Mailhog SMTP Configuration
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# File Storage
app.storage.local-dir=./uploads

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
