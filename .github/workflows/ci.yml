name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (Java 21 + MySQL 8.0)
    runs-on: ubuntu-latest

    # AppointmentConcurrencyTest runs under the "mysql-test" profile, which needs a
    # real MySQL 8.0 (H2 cannot prove the unique-key / row-lock behaviour).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hms_test
          MYSQL_USER: hms
          MYSQL_PASSWORD: hms_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Matches spring.datasource.password=${DB_PASSWORD:...} in
      # apps/api/src/test/resources/application-mysql-test.properties.
      DB_PASSWORD: hms_ci_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests (H2 + MySQL concurrency)
        working-directory: apps/api
        run: mvn -B test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
